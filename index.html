<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Sistema de Solicitud de Documentos Físicos</title>
</head>

<body style="font-family: Arial; background-color: #f4f6f9; padding:20px;">

    <h1>📄 Sistema de Solicitud de Documentos Físicos</h1>

    <hr>

    <h2>Nueva Solicitud</h2>

    <p>Número de Solicitud:</p>
    <input id="numero" type="text" readonly><br><br>

    <p>Solicitante:</p>
    <input id="solicitante" type="text"><br><br>

    <p>Área Solicitante:</p>
    <input id="area" type="text"><br><br>

    <p>Documento Solicitado:</p>
    <input id="documento" type="text"><br><br>

    <p>Fecha de Solicitud:</p>
    <input id="fecha" type="date"><br><br>

    <button onclick="guardarSolicitud()"
        style="background-color:green;color:white;padding:10px;">
        Guardar Solicitud
    </button>

    <hr>

    <h2>Solicitudes Registradas</h2>

    <table border="1" cellpadding="8">
        <thead>
            <tr>
                <th>N° Solicitud</th>
                <th>Solicitante</th>
                <th>Área</th>
                <th>Documento</th>
            </tr>
        </thead>

        <tbody id="tablaSolicitudes">
        </tbody>
    </table>

    <script>

        let solicitudes =
            JSON.parse(localStorage.getItem("solicitudes")) || [];

        function actualizarNumero() {

            let siguiente =
                solicitudes.length + 1;

            document.getElementById("numero").value =
                "SDF-2026-" +
                String(siguiente).padStart(6, '0');
        }

        function mostrarSolicitudes() {

            let tabla =
                document.getElementById("tablaSolicitudes");

            tabla.innerHTML = "";

            solicitudes.forEach(function (s) {

                tabla.innerHTML += `
                <tr>
                    <td>${s.numero}</td>
                    <td>${s.solicitante}</td>
                    <td>${s.area}</td>
                    <td>${s.documento}</td>
                </tr>
                `;

            });
        }

        function guardarSolicitud() {

            let nuevaSolicitud = {

                numero:
                    document.getElementById("numero").value,

                solicitante:
                    document.getElementById("solicitante").value,

                area:
                    document.getElementById("area").value,

                documento:
                    document.getElementById("documento").value
            };

            solicitudes.push(nuevaSolicitud);

            localStorage.setItem(
                "solicitudes",
                JSON.stringify(solicitudes)
            );

            mostrarSolicitudes();

            actualizarNumero();

            document.getElementById("solicitante").value = "";
            document.getElementById("area").value = "";
            document.getElementById("documento").value = "";
        }

        mostrarSolicitudes();
        actualizarNumero();

    </script>

</body>

</html>

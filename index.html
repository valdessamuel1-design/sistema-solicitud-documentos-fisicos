<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Sistema de Solicitud de Documentos Físicos</title>
</head>

<body style="font-family: Arial; background-color: #f4f6f9; padding:20px;">

    <h1>📄 Sistema de Solicitud de Documentos Físicos</h1>

    <hr>

    <h2>Nueva Solicitud</h2>

    <p>Número de Solicitud:</p>
    <input id="numero" type="text" readonly><br><br>

    <p>Solicitante:</p>
    <input id="solicitante" type="text"><br><br>

    <p>Área Solicitante:</p>
    <input id="area" type="text"><br><br>

    <p>Documento Solicitado:</p>
    <input id="documento" type="text"><br><br>

    <p>Fecha de Solicitud:</p>
    <input id="fecha" type="date"><br><br>

    <button onclick="guardarSolicitud()"
        style="background-color:green;color:white;padding:10px;">
        Guardar Solicitud
    </button>

    <hr>

    <h2>Solicitudes Registradas</h2>

    <table border="1" cellpadding="8">
        <thead>
            <tr>
                <th>N° Solicitud</th>
                <th>Solicitante</th>
                <th>Área</th>
                <th>Documento</th>
                <th>Fecha</th>
            </tr>
        </thead>

        <tbody id="tablaSolicitudes">
        </tbody>

    </table>

    <script>

        function obtenerSiguienteNumero() {

            let solicitudes =
                JSON.parse(localStorage.getItem("solicitudes")) || [];

            let correlativo = solicitudes.length + 1;

            return "SDF-2026-" +
                String(correlativo).padStart(6, "0");
        }

        function actualizarNumero() {

            document.getElementById("numero").value =
                obtenerSiguienteNumero();
        }

        function guardarSolicitud() {

            let solicitud = {
                numero: document.getElementById("numero").value,
                solicitante: document.getElementById("solicitante").value,
                area: document.getElementById("area").value,
                documento: document.getElementById("documento").value,
                fecha: document.getElementById("fecha").value
            };

            let solicitudes =
                JSON.parse(localStorage.getItem("solicitudes")) || [];

            solicitudes.push(solicitud);

            localStorage.setItem(
                "solicitudes",
                JSON.stringify(solicitudes)
            );

            agregarFila(solicitud);

            document.getElementById("solicitante").value = "";
            document.getElementById("area").value = "";
            document.getElementById("documento").value = "";
            document.getElementById("fecha").value = "";

            actualizarNumero();
        }

        function agregarFila(solicitud) {

            let fila = `
                <tr>
                    <td>${solicitud.numero}</td>
                    <td>${solicitud.solicitante}</td>
                    <td>${solicitud.area}</td>
                    <td>${solicitud.documento}</td>
                    <td>${solicitud.fecha}</td>
                </tr>
            `;

            document.getElementById("tablaSolicitudes")
                .insertAdjacentHTML("beforeend", fila);
        }

        function cargarSolicitudes() {

            let solicitudes =
                JSON.parse(localStorage.getItem("solicitudes")) || [];

            solicitudes.forEach(function (solicitud) {
                agregarFila(solicitud);
            });

            actualizarNumero();
        }

        cargarSolicitudes();

    </script>

</body>

</html>

<script>

let contador = 2;

cargarSolicitudes();

function guardarSolicitud() {

    let solicitante =
        document.getElementById("solicitante").value;

    let area =
        document.getElementById("area").value;

    let documento =
        document.getElementById("documento").value;

    let numero =
        "SDF-2026-" +
        String(contador).padStart(6, '0');

    let solicitud = {
        numero,
        solicitante,
        area,
        documento
    };

    let solicitudes =
        JSON.parse(localStorage.getItem("solicitudes")) || [];

    solicitudes.push(solicitud);

    localStorage.setItem(
        "solicitudes",
        JSON.stringify(solicitudes)
    );

    agregarFila(solicitud);

    contador++;

    document.getElementById("numero").value =
        "SDF-2026-" +
        String(contador).padStart(6, '0');

    document.getElementById("solicitante").value = "";
    document.getElementById("area").value = "";
    document.getElementById("documento").value = "";
}

function agregarFila(solicitud) {

    let fila = `
        <tr>
            <td>${solicitud.numero}</td>
            <td>${solicitud.solicitante}</td>
            <td>${solicitud.area}</td>
            <td>${solicitud.documento}</td>
        </tr>
    `;

    document
        .getElementById("tablaSolicitudes")
        .innerHTML += fila;
}

function cargarSolicitudes() {

    let solicitudes =
        JSON.parse(localStorage.getItem("solicitudes")) || [];

    solicitudes.forEach(solicitud => {
        agregarFila(solicitud);
    });

    contador = solicitudes.length + 2;

    document.getElementById("numero").value =
        "SDF-2026-" +
        String(contador).padStart(6, '0');
}

</script>
